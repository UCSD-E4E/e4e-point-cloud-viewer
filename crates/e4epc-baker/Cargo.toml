[package]
name = "e4epc-baker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "LAZ ingestion, normalization, and splat baking for the E4E point cloud viewer."

[lints]
workspace = true

[dependencies]
e4epc-formats = { path = "../e4epc-formats" }
kiddo = "5"
las = { version = "0.9", features = ["laz"] }
nalgebra = "0.33"
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
